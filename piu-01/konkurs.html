<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Konkurs plastyczny</title>
    <link rel="stylesheet" href="css/konkurs.css" />
</head>

<body>
    <input type="checkbox" id="noc" class="ukryty" />
    <header>
        <h1>
            Zgłoszenie<br>do Konkursu Plastycznego
        </h1>
        <label for="noc" title="Zmień motyw">🌗</label>
    </header>

    <form action="https://httpbin.org/get" method="get">
        <label for="imie">Imię:</label>
        <input type="text" id="imie" name="imie" maxlength="30" required />

        <label for="nazwisko">Nazwisko:</label>
        <input type="text" id="nazwisko" name="nazwisko" maxlength="50" required />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />

        <label for="miasto">Miasto:</label>
        <input type="text" id="miasto" name="miasto" list="lista-miast" placeholder="Wpisz lub wybierz" required />

        <datalist id="lista-miast">
            <option value="Warszawa"></option>
            <option value="Kraków"></option>
            <option value="Gdańsk"></option>
            <option value="Poznań"></option>
            <option value="Wrocław"></option>
        </datalist>

        <label for="data-urodzenia">Data urodzenia:</label>
        <input type="date" id="data-urodzenia" name="data-urodzenia" required />

        <label for="prace">Liczba zgłaszanych prac (od 1 do 6):</label>
        <input type="number" id="prace" name="prace" min="1" max="6" required />

        <label for="kolor">Kolor wiodący prac:</label>
        <input type="color" id="kolor" name="kolor" value="#ffd700" required />

        <label for="kategoria">Kategoria pracy:</label>
        <select id="kategoria" name="kategoria" required>
            <option value="">-- wybierz kategorię --</option>
            <option value="Rysunek">Rysunek</option>
            <option value="Malarstwo">Malarstwo</option>
            <option value="Grafika cyfrowa">Grafika cyfrowa</option>
        </select>

        <fieldset>
            <legend>Publikacja pracy online:</legend>
            <div>
                <input type="radio" id="publikacja-tak" name="publikacja" value="Tak" required />
                <label for="publikacja-tak">Tak</label>
            </div>
            <div>
                <input type="radio" id="publikacja-nie" name="publikacja" value="Nie" />
                <label for="publikacja-nie">Nie</label>
            </div>
        </fieldset>
        <div>
            <input type="checkbox" id="zgoda" name="zgoda" required />
            <label for="zgoda">Zgadzam się na regulamin konkursu</label>
        </div>
        <button type="submit">Wyślij zgłoszenie</button>
    </form>
</body>

</html>
